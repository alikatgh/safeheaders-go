      - "06 · Standing on the stdlib: cjson, cgltf, tinyxml2": 06-wrapping-the-stdlib.md
      - "07 · Binary parsing: dr-wav RIFF/PCM": 07-binary-parsing-riff-wav.md
      - "08 · TrueType I — the sfnt table directory": 08-truetype-1-sfnt-tables.md
      - "09 · TrueType II — decoding glyph outlines": 09-truetype-2-glyph-outlines.md
      - "10 · TrueType III — rasterizing the outline": 10-truetype-3-rasterizing.md
