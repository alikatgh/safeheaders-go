name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees:
  - alikatgh

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide details below.

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Which module would this feature apply to?
      options:
        - jsmn-go
        - stb-image-go
        - stb-truetype-go
        - tinyxml2-go
        - cjson-go
        - miniz-go
        - cgltf-go
        - dr-wav-go
        - New module (port of C library)
        - Project-wide / Infrastructure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What problem does this feature solve? What use case does it enable?
      placeholder: |
        I'm working on a project that processes streaming JSON data from APIs.
        The current ParseParallel function requires loading the entire JSON into memory,
        which is inefficient for large streams.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or feature.
      placeholder: |
        Add a ParseStream function that accepts an io.Reader and returns a channel
        of tokens, allowing incremental processing without loading everything into memory.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: |
        - Chunking the input manually (complex and error-prone)
        - Using encoding/json streaming decoder (doesn't provide parallel processing)
    validations:
      required: false

  - type: textarea
    id: api
    attributes:
      label: API Proposal (if applicable)
      description: If you have an idea for the API, describe it here.
      render: go
      placeholder: |
        func ParseStream(r io.Reader) (<-chan Token, <-chan error)

        // Usage:
        tokens, errs := jsmngo.ParseStream(file)
        for token := range tokens {
            // Process token
        }
        if err := <-errs; err != nil {
            // Handle error
        }
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocking my project)
        - High (would significantly improve my workflow)
        - Medium (nice to have)
        - Low (minor improvement)
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to implement this feature and submit a PR
          required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and feature requests
          required: true
        - label: This feature aligns with the project's goals (memory safety, concurrency, zero dependencies)
          required: true
        - label: I have considered backward compatibility implications
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or references about the feature.
      placeholder: |
        - Reference implementation in another library
        - Benchmarks showing potential performance improvement
        - Links to similar features in other projects
    validations:
      required: false
