# golangci-lint configuration (schema v2).
# Verify with: golangci-lint config verify --config .golangci.yml
version: "2"

run:
  timeout: 5m
  # Lint production code only; test files are exercised by `go test`/`-race`.
  tests: false

# Report every finding — never silently cap, so CI reflects the true state.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # Start from the curated default set (errcheck, govet, ineffassign,
  # staticcheck, unused) and add the extras below.
  default: standard
  enable:
    - bodyclose
    - containedctx
    - dogsled
    - dupl
    - durationcheck
    - forbidigo
    - gocognit
    - gocyclo
    - godot
    - godox
    - gosec
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - testpackage
    - thelper
    - unconvert
    - unparam
    - wastedassign
    - whitespace
    - wrapcheck

  settings:
    errcheck:
      # Catch ignored type assertions (x.(T) without the ok form), which can panic.
      check-type-assertions: true
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
    lll:
      line-length: 120
      tab-width: 2
    misspell:
      locale: US
    revive:
      severity: warning
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        # Returning the bare error from an .Err() method (context.Context.Err,
        # bufio.Scanner.Err, …) is idiomatic — the sentinel must stay unwrapped
        # so callers can use errors.Is / == against context.Canceled etc.
        - .Err()

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
